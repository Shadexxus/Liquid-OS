
name: Liquid Universal OS ISO Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debian 13 Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-source.sh

      - name: Build Liquid OS ISO
        shell: bash
        run: |
          set -euo pipefail
          sudo docker run --rm --privileged \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/project" \
            --workdir /project \
            --env DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -euc '
              apt-get update
              apt-get install -y \
                live-build \
                debootstrap \
                squashfs-tools \
                xorriso \
                isolinux \
                syslinux-common \
                syslinux-utils \
                dosfstools \
                mtools \
                ca-certificates \
                python3 \
                file

              bash scripts/check-source.sh
              bash scripts/build-iso.sh
              bash scripts/check-iso.sh \
                dist/Liquid-Universal-OS-Alpha-0.1-amd64.iso
            '

      - name: Check generated ISO
        shell: bash
        run: |
          set -euo pipefail

          ISO="dist/Liquid-Universal-OS-Alpha-0.1-amd64.iso"

          test -s "$ISO"
          cd dist
          sha256sum -c SHA256SUMS
          ls -lh

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Liquid-Universal-OS-Alpha-0.1
          path: |
            dist/*.iso
            dist/SHA256SUMS
            dist/build.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
